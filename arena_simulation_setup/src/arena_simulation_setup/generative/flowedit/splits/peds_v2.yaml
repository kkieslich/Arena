# FLOWEDIT data v2 (Stage 1 dataset, decided 10 Nov 2026): the study design's split (§5) with 10 chains per edit type and
# door entrances on. The 9 Nov pilot (peds_pilot.yaml, hospital_1 only, no entrances) is the development set.
# `flowedit suite` writes it (see split.py and the README); every stage `<world>__s<seed>` runs one 300 s episode.
#
#   train            hospital_1 and office_1 (8 of 10 chains of every edit type) and six further worlds with authored
#                    demand (4 of 5 chains): food_court, hallway_lab, hallway_office, hallway_school, office_open_plan,
#                    waiting_hall_clinic; the base worlds at seeds 1-5, the edits and their geometry-only controls at 1-2
#   held_out_edits   the other chains of every edit type on each train world (20 %: 2 of 10, 1 of 5) and their
#                    controls, at seeds 6-8; their base worlds run at 6-8 as references
#   held_out_worlds  reception, hallway_clinic, library and station_hall, each with authored demand (scenario
#                    `demand`): the base world and chains 1-2 of every edit type the generator makes on it, with their
#                    controls, at seeds 6-8; the base worlds also run at seeds 1-5 for baselines only (stale,
#                    transplanted, across-seed floor), never trained on or scored
#
# Held-out edits are drawn by seed: per train world and edit type, random.Random("flowedit-v2:held-out:<world>:<type>")
# picks 2 chains (1 on the 5-chain worlds) among those the pilot never ran (hospital_1 chains 4-10, office_1 chains
# 2-10), so no test edit was looked at during development. The two further held-out worlds were drawn by seed among the
# eight further worlds before any edit was generated: random.Random("flowedit-v2:held-out-worlds:8").sample(sorted(names), 2).
# More training worlds rather than more edits per world: the pilot's forecaster gained nothing from more edits and lost
# on its unseen world. Chains count from 1 in the generator's order (`flowedit generate <base> --scenario
# <scenario> --seed 0 --per-type 10 --controls`: move, insert, remove, function, access, layout; a function-carrying
# move or insert is followed by its controls). The first chains are the pilot's edits.
#
# reception (2 rooms, 1 door between them, no exterior door) has no door entrances and no access edits. The hallway
# worlds (world generator `hallway`, see their generated_from.yaml) have no access edits either (one door per room); the
# hand-drawn plans (plan.yaml) have 2-5. Every other world has 2-4 exterior doors.
format: flowedit-split/1
sources:
  hospital_1: {scenario: queue, seed: 0, per_type: 10, steps: 1, controls: true}
  office_1: {scenario: default, seed: 0, per_type: 10, steps: 1, controls: true}
  food_court: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true}
  hallway_lab: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true}
  hallway_office: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true}
  hallway_school: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true}
  office_open_plan: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true}
  waiting_hall_clinic: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true}
  reception: {scenario: demand, seed: 0, per_type: 2, steps: 1, controls: true}
  hallway_clinic: {scenario: demand, seed: 0, per_type: 2, steps: 1, controls: true}
  library: {scenario: demand, seed: 0, per_type: 2, steps: 1, controls: true}
  station_hall: {scenario: demand, seed: 0, per_type: 2, steps: 1, controls: true}
duration: 300
# door entrances on: every exterior door gets a source and a sink (the defaults of settings.py written out)
settings:
  entrances:
    rate: 0.05
    max_concurrent: 4
    max_total: 15
    speed: {min: 1.0, max: 1.5}
    stops: 2
seeds:
  train:
    bases: [1, 2, 3, 4, 5]
    edits: [1, 2]
  held_out_edits: [6, 7, 8]
  held_out_worlds: [6, 7, 8]
# held-out worlds' bases also run at train seeds, for the stale and transplanted baselines and the across-seed floor only
baseline_seeds:
  held_out_worlds: [1, 2, 3, 4, 5]
