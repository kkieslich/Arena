# FLOWEDIT data v3 (Stage 1 dataset): data v2's design (peds_v2.yaml) unchanged, its edits made again by generator
# version 6 on the worlds whose use points the crowd reaches. Version 6 tries a moved or inserted model front into the
# room, then turned 90 degrees either way along the wall, before the next spot, refuses every edit that leaves a use
# point, queue slot, stop or room people are sent to out of the crowd's reach (`metrics.use_points`), and gives an
# inserted copy its source's formation. `flowedit suite` writes it (see split.py and the README); every stage
# `<world>__s<seed>` runs one 300 s episode.
#
#   train            hospital_1 and office_1 (8 of 10 chains of every edit type) and six further worlds with authored
#                    demand (4 of 5 chains): food_court, hallway_lab, hallway_office, hallway_school, office_open_plan,
#                    waiting_hall_clinic; the base worlds at seeds 1-5, the edits and their geometry-only controls at 1-2
#   held_out_edits   the other chains of every edit type on each train world (20 %: 2 of 10, 1 of 5) and their
#                    controls, at seeds 6-8; their base worlds run at 6-8 as references
#   held_out_worlds  reception, hallway_clinic, library and station_hall, each with authored demand (scenario
#                    `demand`): the base world and chains 1-5 of every edit type the generator makes on it, with their
#                    controls, at seeds 6-8; the base worlds also run at seeds 1-5 for baselines only (stale,
#                    transplanted, across-seed floor), never trained on or scored
#
# The worlds, partitions, seeds, settings and test crowds are v2's, and so are the draws, so the same chain numbers are
# held out wherever a world makes as many chains of a type as in v2. Held-out edits are drawn by seed: per train world
# and edit type, random.Random("flowedit-v2:held-out:<world>:<type>") picks 2 chains (1 on the 5-chain worlds) among
# those the development pilot (peds_pilot.yaml) never ran (hospital_1 chains 4-10, office_1 chains 2-10). The two
# further held-out worlds were drawn by seed among the eight further worlds before any edit was generated:
# random.Random("flowedit-v2:held-out-worlds:8").sample(sorted(names), 2). Chains count from 1 in the generator's order
# (`flowedit generate <base> --scenario <scenario> --seed 0 --per-type <n> --controls`: move, insert, remove, function,
# access, layout; a function-carrying move or insert is followed by its controls).
#
# Where version 6 makes fewer chains than v2: library has 3 access edits (v2: 5; locking the reading corridor's door or
# the office door shuts walkers out of the study corridor or the office they are sent to, 44 and 53 m2) and
# office_open_plan 3 (v2: 4; locking the kitchen door shuts away its only fountain). reception's fourth move draws a
# fountain spot its second move already took and moves a chair instead, so reception has 4 fountain moves and 13
# controls (v2: 5 and 15).
#
# reception (2 rooms, 1 door between them, no exterior door) has no door entrances and no access edits. The hallway
# worlds (world generator `hallway`, see their generated_from.yaml) have no access edits either (one door per room); the
# hand-drawn plans (plan.yaml) have 2-5. Every other world has 2-4 exterior doors.
format: flowedit-split/1
sources:
  hospital_1: {scenario: queue, seed: 0, per_type: 10, steps: 1, controls: true, generator_version: 6}
  office_1: {scenario: default, seed: 0, per_type: 10, steps: 1, controls: true, generator_version: 6}
  food_court: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true, generator_version: 6}
  hallway_lab: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true, generator_version: 6}
  hallway_office: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true, generator_version: 6}
  hallway_school: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true, generator_version: 6}
  office_open_plan: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true, generator_version: 6}
  waiting_hall_clinic: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true, generator_version: 6}
  reception: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true, generator_version: 6}
  hallway_clinic: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true, generator_version: 6}
  library: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true, generator_version: 6}
  station_hall: {scenario: demand, seed: 0, per_type: 5, steps: 1, controls: true, generator_version: 6}
duration: 300
# door entrances on: every exterior door gets a source and a sink (the defaults of settings.py written out)
settings:
  entrances:
    rate: 0.05
    max_concurrent: 4
    max_total: 15
    speed: {min: 1.0, max: 1.5}
    stops: 2
seeds:
  train:
    bases: [1, 2, 3, 4, 5]
    edits: [1, 2]
  held_out_edits: [6, 7, 8]
  held_out_worlds: [6, 7, 8]
# held-out worlds' bases also run at train seeds, for the stale and transplanted baselines and the across-seed floor only
baseline_seeds:
  held_out_worlds: [1, 2, 3, 4, 5]
