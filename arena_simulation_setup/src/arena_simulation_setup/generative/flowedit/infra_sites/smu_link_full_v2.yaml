# INFRA site config of smu_link_full_v2: the twin smu_link_full with its walkable floor on the real wall faces (the west ramp's east
# wall on the glass railing / kiosk-front line, the T-junction stair well no floor, the lower concourse up to the stair foot), and
# the T-junction stairs and escalators as links: the site's facts (study design §2, §3, §9) and the study crowd.
# `flowedit infra` reads it by the site's name; `--site-config` takes another. It names no elements: the catalog's
# rules in place.py read these facts (a locker within walking distance of a recipient entrance, the courier handoff
# point at the courier access point, chargers and lockers within cable run of an outlet) and the search decides.
#
#   entrances:      name, type (mrt, building, shop, escalator, stairs, lift, other), position as `at: [x, y]` or a
#                   `polygon: [[x, y], ...]` in the world frame, `recipients: true` where parcel recipients come in,
#                   `placeholder: true` where the position is not surveyed yet
#   courier_access: [x, y], where couriers arrive with parcels; the courier handoff point stands there
#   outlets:        [[x, y], ...], the power outlets as marked on the walls; the cable-run rule measures from them
#   exclude:        zones no element goes to besides those NAV@r cuts off at 0.325 m (left out on their own)
#   flow_split:     the share of the crowd's inflow per group of entrance types, split evenly within a group, at the
#                   crowd's total rate; `flowedit infra crowd` builds the crowd from it
#   crowd_side:     the side the crowd keeps to (right, left, none), HumanSim's global_planner.lane_side in every suite
#   links:          stair and escalator halves joining floor the twin lays out on one level, as HumanSim teleport zones
#                   (name, kind, destinations, entry, wait, hold, footprint, open, delay, belt; poses as {x, y, theta}):
#                   the crowd's scenario carries them as `teleport_zones`, and walkers that climb take them where that is
#                   cheaper than walking (HumanSim's zone_route_choice, on in every suite); an entrance a link replaces leaves
#                   `entrances`
#   crowd_density:  the crowd's design density and what sets its rate by Little's law (walkers present = inflow x mean
#                   time on the site): density [ped/m2] on area_m2 of floor, and mean_time_s, the mean time a walker
#                   spends on the site from its source to its sink, measured in the site's crowd; `flowedit infra crowd`
#                   then sets the inflow in all to density x area_m2 / mean_time_s (`--density` for another density,
#                   `--rate` to set the inflow directly)
#
# Entrances from the site zone map (marked on the twin's top-down and in its 3D scan), on the twin's walking floor (free map cells a 0.325 m walker reaches from the upper concourse): the MRT exits, building
# doors, lifts, escalators and stairs, and the shops, places and rooms people walk into (types shop and other); the
# benches are left out. A polygon is the mark's floor 0.35 m off the walls where 6 m2 or more of it lies inside the
# mark; `at` is the middle of the walkway along a mark drawn beyond the wall (the crowd cuts a 4 m square round it).
# `placeholder`: rooms whose door is not marked (the anchor is the middle of their edge on the walkway).
# SCIS1's foyer (the world's side_room) lies behind its glass doors, cut off on purpose: scis1_entrance stands on the
# concourse side of the door line.
site: smu_link_full_v2
# the crowd every stage runs (scenarios/<name> of the site); layout copies also get its locker_visitors.yaml;
# `flowedit infra crowd --name study_entrances --out <site>/scenarios` builds it from the entrances below
scenario: study_entrances
