# INFRA site config of the twin smu_link_full: the site's facts (study design §2, §3, §9) and the study crowd.
# `flowedit infra` reads it by the site's name; `--site-config` takes another. It names no elements: the catalog's
# rules in place.py read these facts (a locker within walking distance of a recipient entrance, the courier handoff
# point at the courier access point, chargers and lockers within cable run of an outlet) and the search decides.
#
#   entrances:      name, type (mrt, building, shop, escalator, stairs, lift, other), position as `at: [x, y]` or a
#                   `polygon: [[x, y], ...]` in the world frame, `recipients: true` where parcel recipients come in,
#                   `placeholder: true` where the position is not surveyed yet
#   courier_access: [x, y], where couriers arrive with parcels; the courier handoff point stands there
#   outlets:        [[x, y], ...], power outlets; none known yet, so the outlet rule stays unknown
#   exclude:        zones no element goes to besides those NAV@r cuts off at 0.325 m (left out on their own)
#   flow_split:     the share of the crowd's inflow per group of entrance types, split evenly within a group, at the
#                   crowd's total rate; `flowedit infra crowd` builds the crowd from it
#   crowd_side:     the side the crowd keeps to (right, left, none), HumanSim's global_planner.lane_side in every suite
#   crowd_density:  the crowd's design density and what sets its rate by Little's law (walkers present = inflow x mean
#                   time on the site): density [ped/m2] on area_m2 of floor, and mean_time_s, the mean time a walker
#                   spends on the site from its source to its sink, measured in the site's crowd; `flowedit infra crowd`
#                   then sets the inflow in all to density x area_m2 / mean_time_s (`--density` for another density,
#                   `--rate` to set the inflow directly)
site: smu_link_full
# the crowd every stage runs (scenarios/<name> of the site); layout copies also get its locker_visitors.yaml;
# `flowedit infra crowd --name study_entrances --out <site>/scenarios` builds it from the entrances below
scenario: study_entrances
# the 4 % ramp
exclude: [ramp]
# placeholder positions, read off the site zone map against the twin's floor (about +-10 m along the walkway)
entrances:
  - name: bras_basah_2
    type: mrt
    polygon: [[146.4, 9.4], [152.2, 9.4], [152.2, 11.1], [146.4, 11.1]]
    placeholder: true
  - name: escalator_1
    type: escalator
    polygon: [[143.2, 301.2], [148.3, 301.2], [148.3, 303.6], [143.2, 303.6]]
    placeholder: true
  - name: mrt_bencoolen
    type: mrt
    at: [157.5, 241.5]
    recipients: true
    placeholder: true
  - name: scis1_student
    type: building
    at: [136.5, 210.0]
    recipients: true
    placeholder: true
  - name: scis1_staff
    type: building
    at: [136.5, 206.0]
    recipients: true
    placeholder: true
# placeholder: the south end beside bras_basah_2
courier_access: [152.44, 19.61]
outlets: []
# the side walkers keep to: left, as on Singapore's footpaths (LTA Active Mobility code of conduct: keep left on
# footpaths and shared paths); HumanSim's default is right (Helbing et al. 2001; Moussaid et al. 2009)
crowd_side: left
# the density the twin's crowd sustains: 0.8 ped/s in all (0.1361 x 1264 / 215), below the study design's 0.3 ped/m2
# (§9; 1.76 ped/s). The crowd model's two-way capacity in the twin's narrow passages sets it: in HumanSim alone (the
# entrance crowd, side left, 1500 s) the walkers present keep growing after the 420 s warm-up at 0.9-1.2 ped/s, in the
# north loop (a 1.5 m corridor and a 1.6-1.7 m passage with pillars, Escalator 1's two-way traffic) and in the junction
# under the north block (a 2.7 m neck): +14 per 100 s at 0.9 (1 of 3 seeds), +7 to +31 at 1.0 (2 of 3), +12 to +22 at
# 1.1 (2 of 3), +17 to +37 at 1.2 (3 of 3); at 0.8 they stay flat at seeds 1-5 (-1.7 to +2.2 per 100 s, about 160
# walkers, at most 3 standing still for a minute). area_m2: the floor within 2.5 m of the through-route (1264 m2; the
# route 313 m at r 0.325). mean_time_s: walkers present / inflow over 420-800 s (206 s) and the mean time to their sink
# of the walkers released 420-1100 s (221 s), at 1.2 ped/s, seed 1; remeasure when the entrances, the crowd model or the
# site change.
crowd_density: {density: 0.1361, area_m2: 1264, mean_time_s: 215}
# placeholder until the entrances are ranked
flow_split:
  - {types: [mrt], share: 0.5}
  - {types: [building, shop, escalator, stairs], share: 0.3}
  - {types: [lift, other], share: 0.2}
