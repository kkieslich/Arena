# INFRA site config of the twin smu_link_full: the site's facts (study design §2, §3, §9) and the study crowd.
# `flowedit infra` reads it by the site's name; `--site-config` takes another. It names no elements: the catalog's
# rules in place.py read these facts (a locker within walking distance of a recipient entrance, the courier handoff
# point at the courier access point, chargers and lockers within cable run of an outlet) and the search decides.
#
#   entrances:      name, type (mrt, building, shop, escalator, stairs, lift, other), position as `at: [x, y]` or a
#                   `polygon: [[x, y], ...]` in the world frame, `recipients: true` where parcel recipients come in,
#                   `placeholder: true` where the position is not surveyed yet
#   courier_access: [x, y], where couriers arrive with parcels; the courier handoff point stands there
#   outlets:        [[x, y], ...], power outlets; none known yet, so the outlet rule stays unknown
#   exclude:        zones no element goes to besides those NAV@r cuts off at 0.325 m (left out on their own)
#   flow_split:     the share of the crowd's inflow per group of entrance types, split evenly within a group, at the
#                   crowd's total rate; for the crowd built from the entrances
site: smu_link_full
# the crowd every stage runs (scenarios/<name> of the site); layout copies also get its locker_visitors.yaml
scenario: study_mix_v2
# the 4 % ramp
exclude: [ramp]
# placeholder positions, read off the site zone map against the twin's floor (about +-10 m along the walkway)
entrances:
  - name: bras_basah_2
    type: mrt
    polygon: [[146.4, 9.4], [152.2, 9.4], [152.2, 11.1], [146.4, 11.1]]
    placeholder: true
  - name: escalator_1
    type: escalator
    polygon: [[143.2, 301.2], [148.3, 301.2], [148.3, 303.6], [143.2, 303.6]]
    placeholder: true
  - name: mrt_bencoolen
    type: mrt
    at: [157.5, 241.5]
    recipients: true
    placeholder: true
  - name: scis1_student
    type: building
    at: [136.5, 210.0]
    recipients: true
    placeholder: true
  - name: scis1_staff
    type: building
    at: [136.5, 206.0]
    recipients: true
    placeholder: true
# placeholder: the south end beside bras_basah_2
courier_access: [152.44, 19.61]
outlets: []
# placeholder until the entrances are ranked
flow_split:
  - {types: [mrt], share: 0.5}
  - {types: [building, shop, escalator, stairs], share: 0.3}
  - {types: [lift, other], share: 0.2}
